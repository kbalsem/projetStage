<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur - GitDoc AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="auth-page">

        <nav class="auth-nav">
            <a href="/" class="nav-logo">
                <div class="logo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                gitdoc<span class="logo-accent"></span>
            </a>
            <div class="nav-actions">
                <label class="switch" id="themeToggle" title="Changer le thème">
                    <input type="checkbox" id="themeCheckbox">
                    <span class="slider"></span>
                </label>
            </div>
        </nav>

        <div class="auth-container">
            <div class="auth-card">

                <div class="auth-header">
                    <div class="auth-icon" style="background: var(--danger-bg);">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                    </div>
                    <h1>Une erreur est survenue</h1>
                    <p>L'analyse n'a pas pu être effectuée</p>
                </div>

                <div class="alert alert-error">{{ error }}</div>

                <p class="text-muted" style="text-align:center; font-size:0.9rem; margin-top:0.75rem;">
                    Vérifiez que le dépôt existe, qu'il est public (ou que le token fourni a les bons droits), et que l'URL est correcte.
                </p>

                <div style="text-align:center; margin-top:1.5rem;">
                    <a href="/dashboard" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Retour au tableau de bord
                    </a>
                </div>

            </div>
        </div>

    </div>

    <script>
        (() => {
            const checkbox = document.getElementById('themeCheckbox');
            const html = document.documentElement;
            const saved = localStorage.getItem('gitdoc-theme') || 'dark';
            html.setAttribute('data-theme', saved);
            checkbox.checked = (saved === 'dark');
            checkbox.addEventListener('change', () => {
                const next = checkbox.checked ? 'dark' : 'light';
                html.setAttribute('data-theme', next);
                localStorage.setItem('gitdoc-theme', next);
            });
        })();
    </script>

</body>
</html>
